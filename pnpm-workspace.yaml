packages:
  - 'platform/*'
  - 'apps/*'
  - 'packages/*'
linkWorkspacePackages: true
overrides:
  '@justfiles/app': link:./packages/app
verifyDepsBeforeRun: false
# One compiler for the whole repo. A version skew here means `typecheck` and a
# package's own `build` can disagree about the same file.
catalog:
  typescript: 6.0.3
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  '@clerk/shared': true
  '@google/genai': true
  '@mongodb-js/zstd': false
  core-js: false
  esbuild: true
  msw: true
  node-liblzma: false
  protobufjs: true
  sharp: true
  utf-8-validate: false
  workerd: true
