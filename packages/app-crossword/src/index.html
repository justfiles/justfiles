<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Crossword</title>
		<link rel="stylesheet" href="./index.css" />
	</head>
	<body>
		<main id="root"></main>
		<script type="module">
			import '@justfiles/app/client'

			const root = document.getElementById('root')
			let currentSnapshot
			let revealed = false

			const render = (snapshot) => {
				currentSnapshot = snapshot
				root.replaceChildren(view(snapshot))
			}

			const view = (snapshot) => {
				if (!snapshot) return standby('Loading…')
				const { state, context } = snapshot
				if (state !== 'ready' || !context?.grid) return standby(state ?? '—')
				const slots = context.slots ?? []
				const entries = context.entries ?? {}
				const rows = solve(context.grid, slots, entries)
				return crossword(revealed ? rows : hideLetters(rows), slots, entries)
			}

			const solve = (rows, slots, entries) => {
				const cells = rows.map((r) => r.split(''))
				for (const slot of slots) {
					const answer = entries[slot.id]?.answer
					if (!answer) continue
					for (let i = 0; i < answer.length; i++) {
						const r = slot.direction === 'across' ? slot.row : slot.row + i
						const c = slot.direction === 'across' ? slot.col + i : slot.col
						if (cells[r]?.[c] !== '#') cells[r][c] = answer[i]
					}
				}
				return cells.map((r) => r.join(''))
			}

			const hideLetters = (rows) => rows.map((row) => [...row].map((ch) => (ch === '#' ? ch : '.')).join(''))

			const standby = (text) => {
				const el = document.createElement('p')
				el.className = 'standby'
				el.textContent = text
				return el
			}

			const crossword = (rows, slots, entries) => {
				const numbers = numberStarts(slots)
				const el = document.createElement('div')
				el.className = 'crossword'
				el.append(puzzle(rows, numbers), clues(slots, entries, numbers))
				return el
			}

			const puzzle = (rows, numbers) => {
				const el = document.createElement('section')
				el.className = 'puzzle'
				const button = document.createElement('button')
				button.className = 'reveal-toggle'
				button.type = 'button'
				button.ariaPressed = String(revealed)
				button.textContent = revealed ? 'Hide answers' : 'Reveal answers'
				button.addEventListener('click', () => {
					revealed = !revealed
					render(currentSnapshot)
				})
				el.append(button, board(rows, numbers))
				return el
			}

			const board = (rows, numbers) => {
				const width = rows[0]?.length ?? 0
				const grid = document.createElement('div')
				grid.className = 'grid'
				grid.style.gridTemplateColumns = `repeat(${width}, 1fr)`
				rows.forEach((row, r) => {
					for (let c = 0; c < row.length; c++) {
						grid.append(cell(row[c], numbers.get(`${r},${c}`)))
					}
				})
				return grid
			}

			const clues = (slots, entries, numbers) => {
				const el = document.createElement('aside')
				el.className = 'clues'
				for (const direction of ['across', 'down']) {
					const section = document.createElement('section')
					const heading = document.createElement('h2')
					heading.textContent = direction
					section.append(heading)

					const list = document.createElement('ol')
					list.className = 'clue-list'
					for (const slot of slots.filter((s) => s.direction === direction)) {
						const entry = entries[slot.id]
						if (!entry) continue
						const item = document.createElement('li')
						item.className = 'clue'
						const num = document.createElement('span')
						num.className = 'clue-num'
						num.textContent = numbers.get(`${slot.row},${slot.col}`)
						const text = document.createElement('span')
						text.textContent = entry.clue || '—'
						item.append(num, text)
						list.append(item)
					}
					section.append(list)
					el.append(section)
				}
				return el
			}

			const cell = (ch, num) => {
				const el = document.createElement('div')
				el.className = ch === '#' ? 'cell block' : 'cell'
				if (num !== undefined) {
					const tag = document.createElement('span')
					tag.className = 'num'
					tag.textContent = num
					el.append(tag)
				}
				if (ch !== '#' && ch !== '.') {
					const letter = document.createElement('span')
					letter.className = 'letter'
					letter.textContent = ch
					el.append(letter)
				}
				return el
			}

			const numberStarts = (slots) => {
				const starts = [...slots].sort((a, b) => a.row - b.row || a.col - b.col)
				const out = new Map()
				let n = 1
				for (const s of starts) {
					const key = `${s.row},${s.col}`
					if (!out.has(key)) out.set(key, n++)
				}
				return out
			}

			render(window.app.state)
			window.app.subscribe(render)
		</script>
	</body>
</html>
