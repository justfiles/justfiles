<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Hello</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<main>
			<h1>Hello, world.</h1>
			<p>This page is a plain client-only app: a manifest, an HTML file, and one stylesheet. No backend, no state machine.</p>
			<p id="time"></p>
			<p id="status" data-started="false">waiting for host…</p>
			<p id="last" data-state="pending">last visit: …</p>
			<button id="say-hi" type="button">Say hi to the agent</button>
			<p id="agent-status" data-state="idle"></p>
			<hr />
			<p id="tool-notice" data-state="idle">Agent tool: <strong id="tool-label">highlight</strong> registered — ask the agent to highlight the app.</p>
			<p id="highlight-target" style="padding: 8px; border-radius: 4px; transition: background 0.4s;">This text can be highlighted by the agent.</p>
		</main>
		<script src="./hello.js"></script>
	</body>
</html>
