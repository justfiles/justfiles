<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>{{title}}</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module">
			import { gui } from '/app.js'

			const transport = {
				invoke: (action) =>
					fetch('/_dispatch', {
						method: 'POST',
						headers: { 'content-type': 'application/json' },
						body: JSON.stringify(action)
					}).then(async (r) => {
						if (!r.ok) throw new Error(await r.text())
						return r.json()
					}),
				subscribe: (onState) => {
					const es = new EventSource('/_subscribe')
					es.onmessage = (e) => onState(JSON.parse(e.data))
					return () => es.close()
				}
			}
			// Bootstrap only — the host pushes authoritative state via subscribe.
			const state = { count: 0 }
			gui.mount(document.getElementById('app'), state, { transport })
		</script>
	</body>
</html>
