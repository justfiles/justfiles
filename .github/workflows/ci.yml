name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Three devkit tests each load the full TypeScript compiler, and vitest runs
      # them in parallel workers — together they exceed the runner's ~2GB default
      # heap and die with "Ineffective mark-compacts near heap limit".
      - run: pnpm test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
