name: Deploy Worker Production

on:
  push:
    tags:
      - 'worker-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag to deploy from'
        type: string
        required: true

jobs:
  deploy:
    name: Deploy Worker Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-worker-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
    steps:
      - name: Resolve deploy ref
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            deploy_ref="${GITHUB_REF_NAME}"
          else
            deploy_ref="${{ inputs.ref }}"
          fi

          [[ "${deploy_ref}" == worker-v* ]] || {
            echo "Deploy ref must be a worker-v* tag" >&2
            exit 1
          }

          echo "deploy_ref=${deploy_ref}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.deploy_ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          set -eu
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLERK_PUBLISHABLE_KEY}"
          case "${CLERK_PUBLISHABLE_KEY}" in
            pk_live_*) ;;
            *)
              echo "CLERK_PUBLISHABLE_KEY must be a live Clerk key in the production environment"
              exit 1
              ;;
          esac

      - run: pnpm typecheck

      - run: pnpm --filter @justfiles/worker build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.71.0
          command: deploy
          packageManager: pnpm
          workingDirectory: platform/worker
