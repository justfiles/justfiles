name: release

# Releases are driven by package.json#version — the same value the build writes into
# dist/manifest.json — so the tag can never disagree with the manifest. To release:
# bump the version, merge to main. Every other push to main is a no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags decide what has already shipped

      - id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          if git rev-parse --verify --quiet "refs/tags/v${{ steps.version.outputs.value }}" >/dev/null; then
            echo "v${{ steps.version.outputs.value }} is already released — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${{ steps.version.outputs.value }} is new — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      # corepack ships with Node and reads `packageManager` from package.json, so
      # pnpm needs no third-party action to install it.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # The release is gated on green: a bad build never gets a tag.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build

      # Zip the CONTENTS of dist/, so manifest.json sits at the archive root where
      # the catalog importer looks for it. The name is free — the importer takes the
      # sole *.zip asset — so it may as well say what it is.
      - run: cd dist && zip -qr ../draw.zip .

      # actions/attest, not actions/attest-build-provenance: as of v4 the latter is a
      # wrapper over this, and GitHub's docs point new workflows here. `artifact-metadata`
      # is not needed — that permission is only for push-to-registry.
      - uses: actions/attest@v4
        with:
          subject-path: draw.zip

      # `--target` pins the tag to the commit that was actually built and attested.
      # Without it `gh` tags whatever the default branch points at when the API call
      # lands, so a push racing this job would produce a tag whose source is not the
      # source the attestation covers.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.check.outputs.version }}" draw.zip \
            --target "${{ github.sha }}" \
            --title "v${{ needs.check.outputs.version }}" \
            --generate-notes
