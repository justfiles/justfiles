<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Quay</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				font: 14px -apple-system, system-ui, sans-serif;
				color: #f2f2f7;
				-webkit-user-select: none;
				user-select: none;
				/* Just a tint — the blur is the native NSVisualEffectView behind the
				   transparent web view. A CSS backdrop-filter here would be a second,
				   redundant blur that re-samples its backdrop on every window resize,
				   flashing the content for a frame as the panel grows/shrinks. */
				background: rgba(28, 28, 32, 0.24);
			}
			/* One surface: composer pinned at the bottom, content stacked above it. */
			#app {
				height: 100%;
				display: flex;
				flex-direction: column;
				gap: 8px;
				padding: 12px;
				box-sizing: border-box;
				overflow: hidden;
			}
			/* The region above the composer — app matches or the agent transcript.
			   It fills the space the panel grows into and scrolls when it overflows. */
			#content {
				list-style: none;
				margin: 0;
				padding: 0;
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
				gap: 6px;
				overflow: auto;
			}
			/* App matches: best hit adjacent to the composer (bottom), list runs upward. */
			#content.apps {
				flex-direction: column-reverse;
				gap: 4px;
			}
			#composer {
				flex: none;
				width: 100%;
				box-sizing: border-box;
				min-height: 48px;
				max-height: 160px;
				padding: 13px 16px;
				font-family: inherit;
				font-size: 18px;
				line-height: 22px;
				color: #fff;
				border: 0;
				border-radius: 14px;
				background: rgba(255, 255, 255, 0.08);
				outline: none;
				resize: none;
				overflow-y: auto;
				/* Grow with the text (iMessage/ChatGPT style): field-sizing shrink-wraps
				   the textarea to its content, so one line stays 48px and extra lines
				   add height up to max-height, after which it scrolls. */
				field-sizing: content;
				-webkit-user-select: text;
				user-select: text;
			}
			#composer::placeholder {
				color: rgba(255, 255, 255, 0.4);
			}
			.result {
				height: 46px;
				flex: 0 0 46px;
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 0 12px;
				border-radius: 12px;
				cursor: pointer;
			}
			.result.selected,
			.result:hover {
				background: rgba(255, 255, 255, 0.1);
			}
			.glyph {
				width: 30px;
				height: 30px;
				flex: 0 0 30px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 15px;
				font-weight: 700;
				color: #fff;
				border-radius: 8px;
				background: linear-gradient(160deg, #0a84ff, #0040a0);
			}
			.label {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-size: 15px;
			}
			/* The single default-action row (ask / resume) shown when we're a launcher,
			   not chatting. Tinted glyph + dimmer label so it reads as a hint. */
			.result.hint .glyph {
				background: rgba(255, 255, 255, 0.12);
				color: #cdb4ff;
			}
			.result.hint .label {
				opacity: 0.75;
			}
			.msg {
				max-width: 85%;
				padding: 7px 10px;
				border-radius: 12px;
				font-size: 13px;
				line-height: 1.35;
				white-space: pre-wrap;
				word-break: break-word;
			}
			.msg.user {
				align-self: flex-end;
				background: rgba(10, 132, 255, 0.82);
				color: #fff;
			}
			.msg.assistant {
				align-self: flex-start;
				background: rgba(255, 255, 255, 0.08);
			}
			.msg.pending {
				opacity: 0.5;
			}
			#status {
				margin: 0 4px;
				font-size: 13px;
				opacity: 0.5;
			}
			#content[hidden],
			#status[hidden] {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="app">
			<ul id="content" hidden></ul>
			<p id="status" hidden></p>
			<textarea
				id="composer"
				rows="1"
				placeholder="Search apps or message agent…"
				autocomplete="off"
				spellcheck="false"
			></textarea>
		</div>
		<script src="launcher.js"></script>
	</body>
</html>
