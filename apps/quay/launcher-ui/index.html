<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Quay</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				font: 14px -apple-system, system-ui, sans-serif;
				color: #f2f2f7;
				-webkit-user-select: none;
				user-select: none;
				background: rgba(28, 28, 32, 0.55);
			}
			#app {
				height: 100%;
				display: flex;
				flex-direction: column;
				padding: 16px;
				box-sizing: border-box;
			}
			#search {
				width: 100%;
				box-sizing: border-box;
				padding: 12px 14px;
				font-size: 18px;
				color: #fff;
				border: 0;
				border-radius: 12px;
				background: rgba(255, 255, 255, 0.12);
				outline: none;
			}
			#search::placeholder {
				color: rgba(255, 255, 255, 0.4);
			}
			#grid {
				list-style: none;
				margin: 16px 0 0;
				padding: 0;
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 8px;
				overflow: auto;
				flex: 1;
				min-height: 0;
			}
			.tile {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				padding: 14px 8px;
				border-radius: 14px;
				cursor: pointer;
				outline: none;
			}
			.tile:hover,
			.tile:focus {
				background: rgba(255, 255, 255, 0.12);
			}
			.glyph {
				width: 56px;
				height: 56px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 26px;
				font-weight: 700;
				color: #fff;
				border-radius: 14px;
				background: linear-gradient(160deg, #0a84ff, #0040a0);
			}
			.label {
				font-size: 12px;
				opacity: 0.9;
			}
			#status {
				margin: 16px 4px 0;
				font-size: 13px;
				opacity: 0.5;
				display: none;
			}
			#chat {
				margin-top: 12px;
				padding-top: 10px;
				border-top: 1px solid rgba(255, 255, 255, 0.12);
				display: flex;
				flex-direction: column;
				height: 188px;
			}
			#messages {
				list-style: none;
				margin: 0 0 8px;
				padding: 0 2px;
				flex: 1;
				min-height: 0;
				overflow: auto;
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.msg {
				max-width: 85%;
				padding: 7px 10px;
				border-radius: 12px;
				font-size: 13px;
				line-height: 1.35;
				white-space: pre-wrap;
				word-break: break-word;
			}
			.msg.user {
				align-self: flex-end;
				background: #0a84ff;
				color: #fff;
			}
			.msg.assistant {
				align-self: flex-start;
				background: rgba(255, 255, 255, 0.12);
			}
			.msg.pending {
				opacity: 0.5;
			}
			#ask {
				width: 100%;
				box-sizing: border-box;
				padding: 9px 12px;
				font-size: 14px;
				color: #fff;
				border: 0;
				border-radius: 10px;
				background: rgba(255, 255, 255, 0.12);
				outline: none;
			}
			#ask::placeholder {
				color: rgba(255, 255, 255, 0.4);
			}
		</style>
	</head>
	<body>
		<div id="app">
			<input id="search" type="search" placeholder="Search apps…" autocomplete="off" />
			<ul id="grid"></ul>
			<p id="status"></p>
			<div id="chat">
				<ul id="messages"></ul>
				<input id="ask" type="text" placeholder="Ask the agent…" autocomplete="off" />
			</div>
		</div>
		<script src="launcher.js"></script>
	</body>
</html>
