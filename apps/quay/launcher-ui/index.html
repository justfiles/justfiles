<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Quay</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				font: 14px -apple-system, system-ui, sans-serif;
				color: #f2f2f7;
				-webkit-user-select: none;
				user-select: none;
				background: rgba(28, 28, 32, 0.24);
				-webkit-backdrop-filter: blur(24px) saturate(140%);
				backdrop-filter: blur(24px) saturate(140%);
			}
			#app {
				height: 100%;
				display: flex;
				flex-direction: column;
				padding: 12px;
				box-sizing: border-box;
				overflow: hidden;
			}
			#search,
			#ask {
				width: 100%;
				box-sizing: border-box;
				color: #fff;
				border: 0;
				background: rgba(255, 255, 255, 0.08);
				outline: none;
				-webkit-user-select: text;
				user-select: text;
			}
			#search {
				height: 48px;
				padding: 0 16px;
				font-size: 18px;
				border-radius: 14px;
			}
			#search::placeholder,
			#ask::placeholder {
				color: rgba(255, 255, 255, 0.4);
			}
			#results {
				list-style: none;
				margin: 8px 0 0;
				padding: 0;
				display: flex;
				flex: 1;
				min-height: 0;
				flex-direction: column;
				gap: 4px;
				overflow: auto;
			}
			.result {
				height: 46px;
				flex: 0 0 46px;
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 0 12px;
				border-radius: 12px;
				cursor: pointer;
			}
			.result.selected,
			.result:hover {
				background: rgba(255, 255, 255, 0.1);
			}
			.glyph {
				width: 30px;
				height: 30px;
				flex: 0 0 30px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 15px;
				font-weight: 700;
				color: #fff;
				border-radius: 8px;
				background: linear-gradient(160deg, #0a84ff, #0040a0);
			}
			.label {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-size: 15px;
			}
			.ask-agent .glyph {
				background: rgba(255, 255, 255, 0.1);
			}
			#status {
				margin: 8px 4px 0;
				font-size: 13px;
				opacity: 0.5;
			}
			#chat {
				flex: 1;
				min-height: 0;
				display: flex;
				flex-direction: column;
			}
			#messages {
				list-style: none;
				margin: 0 0 10px;
				padding: 0 2px;
				flex: 1;
				min-height: 0;
				overflow: auto;
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.msg {
				max-width: 85%;
				padding: 7px 10px;
				border-radius: 12px;
				font-size: 13px;
				line-height: 1.35;
				white-space: pre-wrap;
				word-break: break-word;
			}
			.msg.user {
				align-self: flex-end;
				background: rgba(10, 132, 255, 0.82);
				color: #fff;
			}
			.msg.assistant {
				align-self: flex-start;
				background: rgba(255, 255, 255, 0.08);
			}
			.msg.pending {
				opacity: 0.5;
			}
			#ask {
				height: 40px;
				padding: 0 12px;
				font-size: 14px;
				border-radius: 10px;
			}
			#search[hidden],
			#results[hidden],
			#status[hidden],
			#chat[hidden] {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="app">
			<input
				id="search"
				type="search"
				placeholder="Search apps or ask agent…"
				autocomplete="off"
				spellcheck="false"
			/>
			<ul id="results" hidden></ul>
			<p id="status" hidden></p>
			<div id="chat" hidden>
				<ul id="messages"></ul>
				<input id="ask" type="text" placeholder="Ask the agent…" autocomplete="off" />
			</div>
		</div>
		<script src="launcher.js"></script>
	</body>
</html>
